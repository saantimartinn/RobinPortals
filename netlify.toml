# Generated by site/generate-config.mjs from apps/*/netlify.toml. Do not edit by hand:
# change the app's own netlify.toml (or site/apps.mjs) and run `npm run site:config`.

[build]
command = "node site/build.mjs --install"
publish = "site/.output/public"

[build.environment]
NODE_VERSION = "22"

[dev]
framework = "#static"
port = 8889
autoLaunch = false

[functions]
directory = "site/.output/functions"

[functions.portal-meet-transcript-poll]
schedule = "*/15 * * * *"

[functions.portal-chat-cleanup]
schedule = "0 3 * * *"

[functions.portal-integration-retry]
schedule = "*/10 * * * *"

[functions.portal-birthday-notifications]
schedule = "0 6 * * *"

[functions.robinjr-meet-transcript-poll]
schedule = "*/15 * * * *"

[functions.robinjr-chat-cleanup]
schedule = "0 3 * * *"

[functions.robinjr-integration-retry]
schedule = "*/10 * * * *"

[functions.robinjr-birthday-notifications]
schedule = "0 6 * * *"

[functions."community-*"]
node_bundler = "esbuild"

[functions.admin-meet-transcript-poll]
schedule = "*/15 * * * *"

[functions.admin-chat-cleanup]
schedule = "0 3 * * *"

[functions.admin-integration-retry]
schedule = "*/10 * * * *"

[functions.admin-finance-treasury-snapshot]
schedule = "59 * * * *"

[functions.admin-web-retention]
schedule = "30 4 * * *"

