name: Robin
options:
  bundleIdPrefix: com.projectrobin
  deploymentTarget:
    iOS: "17.0"
targets:
  Robin:
    type: application
    platform: iOS
    sources:
      - Robin
    resources:
      - path: Robin/Fonts
    info:
      path: Robin/Info.plist
      properties:
        CFBundleDisplayName: Robin
        CFBundleShortVersionString: "0.1.0"
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - RobinDisplay-Medium.ttf
          - RobinDisplay-Bold.ttf
          - RobinSubtitle-Regular.ttf
          - RobinText-Regular.ttf
          - RobinText-Semibold.ttf
        UILaunchScreen: {}
        NSCameraUsageDescription: Robin necesita la cámara para fotografiar el DNI o pasaporte del alumno.
        NSFaceIDUsageDescription: Robin usa Face ID para acceder de forma segura a la contraseña guardada en este iPhone.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Robin/Robin.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectrobin.ios
        DEVELOPMENT_TEAM: 3S84TW36UJ
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  RobinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RobinTests
    dependencies:
      - target: Robin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectrobin.ios.tests
        SWIFT_VERSION: "5.0"
